function buildWeeksA3() {
  return RAW_A3_PRACTICE.map(([range, iesc, mc2, sm, mc3, cc2]) => {
    const [mc3Prof, ...mc3Slots] = mc3;
    const mc3Blocks = mc3Slots.map((slot, i) => ({
      id: uid(),
      disc: mc3Slots.length > 1 ? `Clínica Médica III (prática) — aula ${i + 1}` : "Clínica Médica III (prática)",
      day: slot[0], start: slot[1], end: slot[2], prof: mc3Prof,
    }));
    return {
      range,
      blocks: [
        { id: uid(), disc: "Saúde da Mulher (via A)", day: sm[0], start: sm[1], end: sm[2], prof: sm[3] },
        { id: uid(), disc: "Clínica Cirúrgica II (via B)", day: cc2[0], start: cc2[1], end: cc2[2], prof: cc2[3] },
        { id: uid(), disc: "Clínica Médica II (via A)", day: mc2[0], start: mc2[1], end: mc2[2], prof: mc2[3] },
        ...mc3Blocks,
        { id: uid(), disc: "IESC VII (prática)", day: iesc[0], start: iesc[1], end: iesc[2], prof: iesc[3] },
      ],
    };
  });
}

function buildBlankWeeks() {
  return RAW_WEEKS.map(([range]) => ({
    range,
    blocks: [
      { id: uid(), disc: "Matéria 1", day: "", start: "", end: "", prof: "" },
      { id: uid(), disc: "Matéria 2", day: "", start: "", end: "", prof: "" },
      { id: uid(), disc: "Matéria 3", day: "", start: "", end: "", prof: "" },
    ],
  }));
}

function inTurno(startMin, turno) {
  return startMin >= toMin(turno.from) && startMin < toMin(turno.to);
}

const SLOT_PAIRS = TIME_POINTS.slice(0, -1).map((t, i) => [t, TIME_POINTS[i + 1]]);

function turnoOf(startMin) {
  return TURNOS.find((t) => startMin >= toMin(t.from) && startMin < toMin(t.to)) || TURNOS[TURNOS.length - 1];
}

function buildDayCells(day, blocks) {
  const dayBlocks = blocks.filter((b) => b.day === day);
  const cellAt = new Array(SLOT_PAIRS.length).fill(undefined);
  let r = 0;
  while (r < SLOT_PAIRS.length) {
    if (cellAt[r] !== undefined) { r++; continue; }
    const slotStart = toMin(SLOT_PAIRS[r][0]);
    const here = dayBlocks.filter((b) => b.startMin === slotStart);
    if (here.length) {
      const maxEnd = Math.max(...here.map((b) => b.endMin));
      let span = 1;
      while (r + span < SLOT_PAIRS.length && toMin(SLOT_PAIRS[r + span - 1][1]) < maxEnd) span++;
      cellAt[r] = { blocks: here, span };
      for (let k = 1; k < span; k++) cellAt[r + k] = null;
      r += span;
    } else {
      cellAt[r] = { blocks: [], span: 1 };
      r += 1;
    }
  }
  return cellAt;
}

function GridView({ blocks }) {
  const perDay = useMemo(() => {
    const map = {};
    DAYS.forEach((d) => (map[d] = buildDayCells(d, blocks)));
    return map;
  }, [blocks]);

  return (
    <div style={{ overflowX: "auto", border: "1px solid #e4ddc9", borderRadius: 12, background: "#fff", marginBottom: 22 }}>
      <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 760 }}>
        <thead>
          <tr>
            <th style={gridHeadStyle}></th>
            {DAYS.map((d) => <th key={d} style={gridHeadStyle}>{d}</th>)}
          </tr>
        </thead>
        <tbody>
          {SLOT_PAIRS.map((slot, i) => {
            const turno = turnoOf(toMin(slot[0]));
            return (
              <tr key={i}>
                <td style={{ ...gridTimeStyle, borderLeft: `4px solid ${turno.bar}` }}>{slot[0]}<br/>{slot[1]}</td>
                {DAYS.map((d) => {
                  const cell = perDay[d][i];
                  if (cell === null) return null;
                  const { blocks: cellBlocks, span } = cell;
                  return (
                    <td key={d} rowSpan={span} style={gridCellStyle}>
                      {cellBlocks.map((b) => {
                        const s = TYPE_STYLES[b.type];
                        return (
                          <div
                            key={b.id}
                            style={{
                              background: s.bg,
                              border: `1.5px solid ${b.conflict ? "#d23c3c" : s.border}`,
                              borderRadius: 6,
                              padding: "4px 6px",
                              marginBottom: 4,
                              fontSize: 10.5,
                            }}
                          >
                            <div style={{ fontWeight: 700, color: s.text }}>{b.label}</div>
                            {b.sub && <div style={{ color: s.text, opacity: 0.85 }}>{b.sub}</div>}
                            {b.conflict && <div style={{ color: "#d23c3c", fontWeight: 700 }}>⚠ choque</div>}
                          </div>
                        );
                      })}
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

  });
  const [extras, setExtras] = useState([]);
  const [weekIdx, setWeekIdx] = useState(0);
  const [openEditor, setOpenEditor] = useState(null); // 'fixed' | 'extra' | 'week' | null

  // carregar dados salvos do navegador (localStorage) ao abrir

    const fallbackNames = { B: "Turma B (P6)", A: "Turma A (P8)", H: "Híbrido (B sem Médica + Médica da A)" };
    try {
      const raw = window.localStorage.getItem("meu-horario-tassyla");
      if (raw) {
        const data = JSON.parse(raw);
        if (data.turmas) {
          const fixedTurmas = {};
          Object.entries(data.turmas).forEach(([id, t]) => {
            fixedTurmas[id] = { ...t, name: t.name || fallbackNames[id] || `Cenário ${id}` };
          });
          setTurmas(fixedTurmas);
        }
        if (data.extras) setExtras(data.extras);
      }
    } catch (e) {
      // nada salvo ainda, tudo bem
    }
    setLoaded(true);
  }, []);

  // salvar automaticamente no navegador a cada mudança — instantâneo, sem depender de internet
  useEffect(() => {
    if (!loaded) return;
    setSaveStatus("saving");
    try {
      window.localStorage.setItem("meu-horario-tassyla", JSON.stringify({ turmas, extras }));
      setSaveStatus("saved");
    } catch (e) {
      setSaveStatus("error");
    }
  }, [turmas, extras, loaded]);

  const fixed = turmas[turma]?.fixed || [];
  const weeks = turmas[turma]?.weeks || buildBlankWeeks();

  function setFixed(updater) {
    setTurmas((t) => ({ ...t, [turma]: { ...t[turma], fixed: typeof updater === "function" ? updater(t[turma].fixed) : updater } }));
  }
  function setWeeks(updater) {
    setTurmas((t) => ({ ...t, [turma]: { ...t[turma], weeks: typeof updater === "function" ? updater(t[turma].weeks) : updater } }));
  }

  const currentBlocks = useMemo(() => {
    const rot = weeks[weekIdx].blocks
      .filter((b) => b.day && b.start && b.end)
      .map((b) => ({ id: b.id, day: b.day, start: b.start, end: b.end, label: b.disc, sub: b.prof, type: "practice" }));
    const all = [...fixed, ...extras, ...rot]
      .filter((b) => b.day && b.start && b.end)
      .map((b) => ({ ...b, startMin: toMin(b.start), endMin: toMin(b.end) }));
    all.forEach((b) => {
      b.conflict = all.some(
        (o) => o.id !== b.id && o.day === b.day && !(o.endMin <= b.startMin || o.startMin >= b.endMin)
      );
    });
    return all;
  }, [fixed, extras, weeks, weekIdx]);

  function blocksFor(day, turno) {
    return currentBlocks
      .filter((b) => b.day === day && inTurno(b.startMin, turno))
      .sort((a, b) => a.startMin - b.startMin);
  }

  function updateItem(setter, id, field, value) {
    setter((list) => list.map((b) => (b.id === id ? { ...b, [field]: value } : b)));
  }
  function removeItem(setter, id) {
    setter((list) => list.filter((b) => b.id !== id));
  }
  function updateWeekBlock(id, field, value) {
    setWeeks((ws) =>
      ws.map((w, i) =>
        i !== weekIdx ? w : { ...w, blocks: w.blocks.map((b) => (b.id === id ? { ...b, [field]: value } : b)) }
      )
    );

    if (turma === id) {

    setTurmas(rest);

          <button
            onClick={() => setView("turno")}
            style={{ ...btnStyle, background: view === "turno" ? "#1e2536" : "#fff", color: view === "turno" ? "#fff" : "#3a3f4d", borderColor: view === "turno" ? "#1e2536" : "#d8d2c4" }}
          >
            Por turno
          </button>
          <button
            onClick={() => setView("grade")}
            style={{ ...btnStyle, background: view === "grade" ? "#1e2536" : "#fff", color: view === "grade" ? "#fff" : "#3a3f4d", borderColor: view === "grade" ? "#1e2536" : "#d8d2c4" }}
          >
            Grade horizontal
          </button>
        </div>

        {view === "grade" && <GridView blocks={currentBlocks} />}

        {view === "turno" && TURNOS.map((turno) => (
          <div key={turno.key} style={{ marginBottom: 22, border: "1px solid #e4ddc9", borderRadius: 12, overflow: "hidden", background: "#fff" }}>
            <div style={{ background: turno.bar, padding: "8px 14px", color: "#fff", fontWeight: 800, fontSize: 13, letterSpacing: 1.5 }}>
              {turno.label} <span style={{ fontWeight: 500, opacity: 0.85, fontSize: 11.5 }}>({turno.from}–{turno.to})</span>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)" }}>
              {DAYS.map((day, di) => {
                const items = blocksFor(day, turno);
                return (
                  <div key={day} style={{ padding: 8, borderRight: di < 5 ? "1px solid #f0ead9" : "none", minHeight: 40 }}>
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: "#9a9484", marginBottom: 6, textTransform: "uppercase" }}>{day.slice(0,3)}</div>
                    {items.length === 0 && <div style={{ fontSize: 10.5, color: "#c7c0ac", fontStyle: "italic" }}>livre</div>}
                    {items.map((b) => <Card key={b.id + b.start} b={b} />)}
                  </div>
                );
              })}
            </div>
          </div>
        ))}

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <button onClick={() => setOpenEditor(openEditor === "fixed" ? null : "fixed")} style={btnStyle}>
            {openEditor === "fixed" ? "Fechar" : "Editar"} horários fixos
          </button>
          <button onClick={() => setOpenEditor(openEditor === "week" ? null : "week")} style={btnStyle}>
            {openEditor === "week" ? "Fechar" : "Editar"} prática desta semana
          </button>
          <button onClick={() => setOpenEditor(openEditor === "extra" ? null : "extra")} style={{ ...btnStyle, borderColor: "#4caf82", color: "#134a30" }}>
            {openEditor === "extra" ? "Fechar" : "+"} matérias extras (fora Turma B)
          </button>
        </div>

        {openEditor === "fixed" && (
          <div style={boxStyle}>
            {fixed.map((b) => (
              <Row key={b.id}>
                <select value={b.day} onChange={(e) => updateItem(setFixed, b.id, "day", e.target.value)} style={selStyle}>
                  {DAYS.map((d) => <option key={d}>{d}</option>)}
                </select>
                <select value={b.start} onChange={(e) => updateItem(setFixed, b.id, "start", e.target.value)} style={selStyle}>
                  {TIME_POINTS.map((t) => <option key={t}>{t}</option>)}
                </select>
                <span>–</span>
                <select value={b.end} onChange={(e) => updateItem(setFixed, b.id, "end", e.target.value)} style={selStyle}>
                  {TIME_POINTS.map((t) => <option key={t}>{t}</option>)}
                </select>
                <input value={b.label} onChange={(e) => updateItem(setFixed, b.id, "label", e.target.value)} style={inpStyle} placeholder="Nome" />
                <input value={b.sub} onChange={(e) => updateItem(setFixed, b.id, "sub", e.target.value)} style={inpStyle} placeholder="Docente" />
                <select value={b.type} onChange={(e) => updateItem(setFixed, b.id, "type", e.target.value)} style={selStyle}>
                  <option value="fixed">Fixo</option>
                  <option value="theory">Teoria</option>
                  <option value="iesc">IESC VII</option>
                </select>
                <button onClick={() => removeItem(setFixed, b.id)} style={rmStyle}>Remover</button>
              </Row>
            ))}
            <button onClick={() => setFixed((f) => [...f, { id: uid(), day: "Segunda", start: "07:00", end: "07:50", label: "Nova atividade", sub: "", type: "fixed" }])} style={{ ...btnStyle, marginTop: 6 }}>
              + Adicionar horário fixo
            </button>
          </div>
        )}

        {openEditor === "extra" && (
          <div style={boxStyle}>
            <div style={{ fontSize: 12, color: "#134a30", marginBottom: 8 }}>
              Matérias que você vai cursar fora da Turma B (outros períodos). Aparecem em verde no calendário e valem pra todas as semanas.
            </div>
            {extras.length === 0 && <div style={{ fontSize: 12, color: "#9a9484", marginBottom: 8 }}>Nenhuma matéria extra ainda.</div>}
            {extras.map((b) => (
              <Row key={b.id}>
                <select value={b.day} onChange={(e) => updateItem(setExtras, b.id, "day", e.target.value)} style={selStyle}>
                  {DAYS.map((d) => <option key={d}>{d}</option>)}
                </select>
                <select value={b.start} onChange={(e) => updateItem(setExtras, b.id, "start", e.target.value)} style={selStyle}>
                  {TIME_POINTS.map((t) => <option key={t}>{t}</option>)}
                </select>
                <span>–</span>
                <select value={b.end} onChange={(e) => updateItem(setExtras, b.id, "end", e.target.value)} style={selStyle}>
                  {TIME_POINTS.map((t) => <option key={t}>{t}</option>)}
                </select>
                <input value={b.label} onChange={(e) => updateItem(setExtras, b.id, "label", e.target.value)} style={inpStyle} placeholder="Nome da matéria" />
                <input value={b.sub} onChange={(e) => updateItem(setExtras, b.id, "sub", e.target.value)} style={inpStyle} placeholder="Docente / turma" />
                <button onClick={() => removeItem(setExtras, b.id)} style={rmStyle}>Remover</button>
              </Row>
            ))}
            <button
              onClick={() => setExtras((f) => [...f, { id: uid(), day: "Segunda", start: "07:00", end: "07:50", label: "Nova matéria", sub: "", type: "extra" }])}
              style={{ ...btnStyle, marginTop: 6, borderColor: "#4caf82", color: "#134a30" }}
            >
              + Adicionar matéria extra
            </button>
          </div>
        )}

        {openEditor === "week" && (
          <div style={boxStyle}>
            <div style={{ fontSize: 12, color: "#8a7a5c", marginBottom: 8, fontWeight: 700 }}>
              Semana {weekIdx + 1} · {weeks[weekIdx].range}
            </div>
            {weeks[weekIdx].blocks.map((b) => (
              <Row key={b.id}>
                <input value={b.disc} onChange={(e) => updateWeekBlock(b.id, "disc", e.target.value)} style={{ ...inpStyle, minWidth: 140, fontWeight: 600 }} placeholder="Nome da matéria" />
                <select value={b.day} onChange={(e) => updateWeekBlock(b.id, "day", e.target.value)} style={selStyle}>
                  <option value="">—</option>
                  {DAYS.map((d) => <option key={d}>{d}</option>)}
                </select>
                <select value={b.start} onChange={(e) => updateWeekBlock(b.id, "start", e.target.value)} style={selStyle}>
                  <option value="">—</option>
                  {TIME_POINTS.map((t) => <option key={t}>{t}</option>)}
                </select>
                <span>–</span>
                <select value={b.end} onChange={(e) => updateWeekBlock(b.id, "end", e.target.value)} style={selStyle}>
                  <option value="">—</option>
                  {TIME_POINTS.map((t) => <option key={t}>{t}</option>)}
                </select>
                <input value={b.prof} onChange={(e) => updateWeekBlock(b.id, "prof", e.target.value)} style={inpStyle} placeholder="Docente" />
              </Row>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function Row({ children }) {
  return <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, flexWrap: "wrap" }}>{children}</div>;
}

const btnStyle = { padding: "8px 14px", borderRadius: 8, border: "1px solid #d8d2c4", background: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer", color: "#3a3f4d" };
const boxStyle = { marginTop: 12, padding: 14, background: "#fff", border: "1px solid #e4ddc9", borderRadius: 10 };
const selStyle = { padding: "5px 6px", borderRadius: 6, border: "1px solid #d8d2c4", fontSize: 12 };
const inpStyle = { padding: "5px 8px", borderRadius: 6, border: "1px solid #d8d2c4", fontSize: 12, flex: 1, minWidth: 110 };
const rmStyle = { padding: "5px 10px", borderRadius: 6, border: "1px solid #e8b3b3", background: "#fdeeee", color: "#a83b3b", fontSize: 11.5, cursor: "pointer" };

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
